name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .[dev]

      - name: Run lint
        run: ruff check src tests

      - name: Run tests
        run: pytest

      - name: Run simple agent demo workflow
        run: |
          agentlens init
          python examples/simple_tool_agent/agent.py
          RUN_ID=$(agentlens list-runs | grep -o 'run_[a-f0-9]*' | head -n 1)
          agentlens report
          agentlens report --html
          test -f .agentlens/reports/latest.html
          agentlens show "$RUN_ID"
          agentlens eval examples/simple_tool_agent/evals.yml

      - name: Run LangGraph-style demo workflow
        run: |
          python examples/langgraph_agent/agent.py
          agentlens report --html --output .agentlens/reports/langgraph.html
          test -f .agentlens/reports/langgraph.html
          agentlens eval examples/langgraph_agent/evals.yml
